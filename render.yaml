# render.yaml
# ===========
# Render Blueprint — defines the web service and PostgreSQL database.
# Commit this file to your repo root. Render auto-detects it on deploy.

services:
  - type: web
    name: laredo-ist
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn laredo_ist.wsgi --workers 2 --timeout 120 --log-file -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: laredo_ist.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: laredo-ist-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: laredo-ist-db
    databaseName: laredo_ist
    user: laredo_ist
